# Copy to config.yaml and fill in real values. config.yaml is gitignored.

smtp:
  host: smtp.gmail.com
  port: 465            # 465 = SSL (recommended for Gmail); use 587 with use_ssl=false for STARTTLS
  use_ssl: true
  user: "you@gmail.com"
  # Gmail App Password (16 chars, no spaces). See:
  # https://support.google.com/accounts/answer/185833
  password: "your-16-char-app-password"
  sender_name: "FOHC 24:24 Monitor"

# One or more destination inboxes. A separate email is sent per cigar to ALL
# addresses listed here.
recipients:
  - "diana@example.com"

# Subject line template. {cigar} is substituted with each entry from `cigars`.
subject_template: "24:24 {cigar}"

# Body template. {cigar} is substituted with each entry from `cigars`.
# The leading `|` preserves newlines in YAML.
body_template: |
  Dear Diana,
  Full Name: Brad Ke
  Forum Handle: Bradtheripper
  Country: China
  State: Guangxi Province
  I would like to have a box of {cigar}
  Can you please place the order for me?
  Many Thanks,
  Ronghao Ke

# When a matching 24:24 thread is detected, one email is sent for each cigar
# below (16 emails by default). Order is preserved in the sending loop.
cigars:
  - "Montecristo Edmundo"
  - "Montecristo Petit Edmundo"
  - "Ramon Allones Specially Select"
  - "Bolivar Belicoso Finos"
  - "Bolivar Royal Corona"
  - "Diplomaticos number 2"
  - "H.Upmann Magnum 50"
  - "H.Upmann Magnum 46"
  - "Juan Lopez seleccion number 2"
  - "Romeo y Julieta Wide Churchill"
  - "Quai d'Orsay No.50"
  - "Punch Punch"
  - "Partagas Serie D number 4"
  - "Partagas Serie D number 5"
  - "Partagas Serie P number 2"
  - "Hoyo De Monterrey San Juan"

# How aggressively to poll while inside the monitoring window.
# workers * interval determines effective request rate. 6 workers every 1s
# ≈ one request every ~167ms — tuned for the high-traffic 24:24 drop where
# the forum page can take >1s and overlapping workers mask that latency.
# The scraper pre-warms TCP/TLS at T-30s and SMTP login at T-10s before the
# window opens, so the first in-window request skips handshakes. A raw-text
# "24:24" substring pre-filter also skips BeautifulSoup parsing on the 99.9%
# of polls that don't match.
poll_workers: 6
poll_interval_seconds: 1.0
http_timeout_seconds: 3.0

# File where already-alerted (thread_url, cigar) pairs are recorded so the
# script never double-sends. Safe to delete to reset state.
dedup_state_path: ".state/seen.txt"
